<!doctype html>
<!-- The rail and sidebar are transparent in dark mode, so <html> paints behind them. -->
<html class="h-full bg-surface-base" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frappe CRM</title>
    <!-- Sets the attribute the theme tokens key off, before first paint. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : null
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="h-full overflow-hidden no-scrollbar">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
